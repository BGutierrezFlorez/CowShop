<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear Cuenta | CowShop</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">

  <div class="w-full max-w-xl bg-white rounded-xl shadow-lg p-8">

    <!-- Volver -->
    <a href="index.html" class="text-green-600 text-sm hover:underline">
      ← Volver al inicio
    </a>

    <h1 class="text-2xl font-bold mt-4 mb-6 text-gray-800">
      Crear una cuenta
    </h1>

    <form id="registrationForm" novalidate class="space-y-4">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Nombre</label>
        <input id="fullName" name="FullName" type="text" required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        <p class="hidden text-sm text-red-600">Ingresa tu nombre.</p>
      </div>

      <!-- Cédula -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Cédula</label>
        <input id="cedula" name="Cedula" type="text" pattern="[0-9]+" required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-green-500 focus:outline-none">
        <p class="hidden text-sm text-red-600">Ingresa una cédula válida.</p>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Correo</label>
        <input id="email" name="Email" type="email" required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-green-500 focus:outline-none">
        <p class="hidden text-sm text-red-600">Ingresa un correo válido.</p>
      </div>

      <!-- Teléfono -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Celular</label>
        <input id="phone" name="Phone" type="tel" pattern="\d{10}" required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-green-500 focus:outline-none">
        <p class="hidden text-sm text-red-600">Ingresa un celular válido.</p>
      </div>

      <!-- Fecha -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Fecha de nacimiento</label>
        <input id="birthDate" name="BirthDate" type="date" required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-green-500 focus:outline-none">
      </div>

      <!-- Tipo Usuario -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Tipo de Usuario</label>
        <select id="tipoUsuario" name="UserType" required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:ring-green-500 focus:outline-none">
          <option value="" disabled selected>Seleccione...</option>
          <option value="Comprador">Comprador</option>
          <option value="Vendedor">Vendedor</option>
          <option value="Ambos">Ambos</option>
        </select>
      </div>

      <!-- Rol -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Rol del Usuario</label>
        <select id="userRole" name="UserRole" required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:ring-green-500 focus:outline-none">
          <option value="" disabled selected>Seleccione...</option>
          <option value="4">Comprador</option>
          <option value="5">Vendedor</option>
          <option value="12">Ambos</option>
        </select>
      </div>

      <!-- Membresía -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Membresía</label>
        <select id="membership" name="Membership" required
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:ring-green-500 focus:outline-none">
          <option value="" disabled selected>Seleccione...</option>
          <option value="1">Básica</option>
          <option value="2">Profesional</option>
          <option value="3">Premium</option>
        </select>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <div class="relative">
          <input id="password" name="Password" type="password" minlength="8" required
            class="w-full rounded-lg border border-gray-300 px-3 py-2 pr-10 focus:ring-green-500 focus:outline-none">
          <button type="button" id="togglePassword"
            class="absolute inset-y-0 right-3 text-gray-500">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Confirmar contraseña</label>
        <div class="relative">
          <input id="confirmPassword" name="ConfirmPassword" type="password" required
            class="w-full rounded-lg border border-gray-300 px-3 py-2 pr-10 focus:ring-green-500 focus:outline-none">
          <button type="button" id="toggleConfirmPassword"
            class="absolute inset-y-0 right-3 text-gray-500">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Términos -->
      <div class="flex items-center gap-2">
        <input id="aceptaTerminos" name="Terms" type="checkbox" required
          class="h-4 w-4 text-green-600 rounded">
        <label class="text-sm text-gray-700">
          Acepto Términos y Condiciones
        </label>
      </div>

      <!-- Botón -->
      <button type="submit" id="submitButton"
        class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2 rounded-lg transition">
        Registrarse
        <span id="spinner" class="hidden ml-2 animate-spin">⏳</span>
      </button>

      <!-- Mensajes -->
      <div id="errorMessage" class="hidden text-red-600 text-sm mt-2"></div>
      <div id="successMessage" class="hidden text-green-600 text-sm mt-2"></div>

    </form>
  </div>

  <script src="js/registrarse.js" defer></script>
  <script src="js/session.js"></script>
</body>
</html>
