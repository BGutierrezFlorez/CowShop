<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CowShop | Iniciar Sesión</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

  <!-- Volver -->
  <a href="index.html"
     class="absolute top-6 left-6 text-green-600 text-sm hover:underline flex items-center gap-1">
    <i class="bi bi-arrow-left"></i> Volver al inicio
  </a>

  <!-- Card -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <h1 class="text-2xl font-bold text-gray-800 mb-1">
      Iniciar Sesión
    </h1>
    <p class="text-sm text-gray-500 mb-6">
      Bienvenido de nuevo.
    </p>

    <!-- Formulario -->
    <form id="loginForm" novalidate class="space-y-4">

      <!-- Email -->
      <div>
        <label for="loginEmail" class="block text-sm font-medium text-gray-700">
          Correo electrónico
        </label>
        <input
          type="email"
          id="loginEmail"
          required
          placeholder="correo@ejemplo.com"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2
                 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
        <p class="hidden text-sm text-red-600 mt-1">
          Ingresa un correo válido.
        </p>
      </div>

      <!-- Password -->
      <div>
        <label for="loginPassword" class="block text-sm font-medium text-gray-700">
          Contraseña
        </label>
        <div class="relative">
          <input
            type="password"
            id="loginPassword"
            required
            placeholder="********"
            class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 pr-10
                   focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
          <button
            type="button"
            class="toggle-password absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600"
            aria-label="Mostrar u ocultar contraseña">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <p class="hidden text-sm text-red-600 mt-1">
          Ingresa tu contraseña.
        </p>
      </div>

      <!-- Forgot -->
      <div class="text-right">
        <a href="#" class="text-sm text-green-600 hover:underline">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Botón -->
      <button
        type="submit"
        class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2.5 rounded-lg transition">
        Iniciar Sesión
      </button>

      <!-- Registro -->
      <p class="text-sm text-center text-gray-600 mt-4">
        ¿No tienes una cuenta?
        <a href="registrarse.html" class="text-green-600 hover:underline font-medium">
          Regístrate aquí
        </a>
      </p>

    </form>
  </div>

  <!-- Scripts -->
  <script src="js/session.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
